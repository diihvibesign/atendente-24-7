name: atendente247
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: atendente_owner
      POSTGRES_PASSWORD: local_owner_only
      POSTGRES_DB: atendente
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendente_owner -d atendente"]
      interval: 2s
      timeout: 3s
      retries: 20
  postgres-test:
    image: postgres:17.9-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: atendente_owner
      POSTGRES_PASSWORD: local_owner_only
      POSTGRES_DB: atendente_test
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendente_owner -d atendente_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
