name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: atendente_owner
          POSTGRES_PASSWORD: ci_owner_only
          POSTGRES_DB: atendente_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atendente_owner -d atendente_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://atendente_app:local_app_only@localhost:5432/atendente_test
      MIGRATION_DATABASE_URL: postgresql://atendente_owner:ci_owner_only@localhost:5432/atendente_test
      TEST_DATABASE_URL: postgresql://atendente_app:local_app_only@localhost:5432/atendente_test
      TEST_MIGRATION_DATABASE_URL: postgresql://atendente_owner:ci_owner_only@localhost:5432/atendente_test
      APP_ORIGIN: http://localhost:3000
      PGPASSWORD: ci_owner_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: psql -h localhost -U atendente_owner -d atendente_test -v ON_ERROR_STOP=1 -f infra/postgres/init.sql
      - run: pnpm db:migrate
      - run: pnpm typecheck && pnpm lint && pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit
      - run: pnpm db:demo
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser gates
        run: |
          pnpm dev > .local/ci-server.log 2>&1 &
          node scripts/wait-ready.mjs http://127.0.0.1:3001/health http://localhost:3000/login
          pnpm test:e2e
